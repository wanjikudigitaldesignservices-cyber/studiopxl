<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PXL Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Poppins',sans-serif;background:#0D001A;color:#e0e0e0}h1,h2{font-family:'Montserrat',sans-serif;text-transform:uppercase;font-weight:900}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1A0033}.lb{background:#0D001A;padding:50px;max-width:400px;width:100%;text-align:center;border:1px solid rgba(0,255,255,0.2);box-shadow:0 0 30px rgba(138,43,226,0.3)}.lb h2{color:#00FFFF;margin-bottom:30px;font-size:2rem;letter-spacing:2px}.lb input{width:100%;padding:16px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.02);color:#fff;margin-bottom:20px;font-family:'Poppins',sans-serif;outline:none}.lb input:focus{border-color:#8A2BE2}.lb button{width:100%;padding:16px;background:#8A2BE2;color:#fff;border:none;cursor:pointer;font-family:'Montserrat',sans-serif;text-transform:uppercase;letter-spacing:2px;font-weight:700;transition:0.3s}.lb button:hover{background:#00FFFF;color:#0D001A}
.dash{display:none}.dh{background:#1A0033;padding:30px 40px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px;border-bottom:1px solid rgba(0,255,255,0.2)}.dh h1{font-size:2rem;color:#00FFFF;letter-spacing:2px}.dh button,.dh a{padding:12px 24px;border:1px solid #00FFFF;cursor:pointer;font-size:0.8rem;color:#00FFFF;background:transparent;text-decoration:none;font-family:'Montserrat',sans-serif;text-transform:uppercase;letter-spacing:2px;font-weight:700;transition:0.3s}.dh button:hover,.dh a:hover{background:#00FFFF;color:#0D001A}.be{background:#8A2BE2!important;color:#fff!important;border-color:#8A2BE2!important}.be:hover{background:#fff!important;color:#8A2BE2!important}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;padding:40px}.sc{background:#1A0033;padding:30px;border:1px solid rgba(255,255,255,0.05);text-align:center}.sl{font-size:0.85rem;color:#888;text-transform:uppercase;letter-spacing:2px;font-weight:700}.sv{font-size:3.5rem;font-family:'Montserrat',sans-serif;font-weight:900;margin-top:10px;color:#00FFFF}
.tw{padding:0 40px 40px;overflow-x:auto}table{width:100%;border-collapse:collapse;background:#1A0033;border:1px solid rgba(255,255,255,0.05)}th{background:#0D001A;color:#888;padding:20px;text-align:left;font-size:0.85rem;text-transform:uppercase;letter-spacing:2px;border-bottom:1px solid rgba(255,255,255,0.05);font-family:'Montserrat',sans-serif}td{padding:20px;border-bottom:1px solid rgba(255,255,255,0.05);font-size:0.95rem;color:#e0e0e0}
select.st{padding:8px 12px;border:1px solid rgba(255,255,255,0.1);font-family:'Poppins',sans-serif;background:#0D001A;color:#00FFFF;outline:none;font-weight:500}.del{background:none;border:none;color:#888;cursor:pointer;font-size:0.85rem;text-transform:uppercase;letter-spacing:1px;transition:0.3s}.del:hover{color:#ef4444}
@media(max-width:768px){.stats{grid-template-columns:1fr}}</style></head>
<body>
<div class="login" id="ls"><div class="lb"><h2>PXL AUTH</h2><input type="text" id="u" value="admin"><input type="password" id="p" placeholder="Password"><button onclick="login()">Enter System</button></div></div>
<div class="dash" id="dash">
<div class="dh"><h1>Project Briefs</h1><div><button class="be" onclick="exp()">Export</button> <a href="index.html">View Site</a> <button onclick="logout()">Logout</button></div></div>
<div class="stats"><div class="sc"><div class="sl">Total Briefs</div><div class="sv" id="st">0</div></div><div class="sc"><div class="sl">New / Unread</div><div class="sv" id="sn" style="color:#fff">0</div></div><div class="sc"><div class="sl">Active Projects</div><div class="sv" id="sd" style="color:#8A2BE2">0</div></div></div>
<div class="tw"><table><thead><tr><th>Date</th><th>Client / Brand</th><th>Email</th><th>Service Type</th><th>Budget</th><th>Brief Details</th><th>Status</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div>
<script>
const K='studiopxl_briefs';if(sessionStorage.getItem('pxl_admin')==='true')showD();
function login(){if(document.getElementById('u').value==='admin'&&document.getElementById('p').value==='admin123'){sessionStorage.setItem('pxl_admin','true');showD()}else alert('Invalid credentials')}
function logout(){sessionStorage.removeItem('pxl_admin');location.reload()}
function showD(){document.getElementById('ls').style.display='none';document.getElementById('dash').style.display='block';render()}
function gd(){return JSON.parse(localStorage.getItem(K)||'[]').sort((a,b)=>new Date(b.submittedAt)-new Date(a.submittedAt))}
function sv(d){localStorage.setItem(K,JSON.stringify(d))}
function render(){const d=gd();document.getElementById('st').textContent=d.length;document.getElementById('sn').textContent=d.filter(x=>x.status==='New Brief').length;document.getElementById('sd').textContent=d.filter(x=>x.status==='In Production').length;
document.getElementById('tb').innerHTML=d.map(i=>`<tr><td>${new Date(i.submittedAt).toLocaleDateString('en-GB')}</td><td style="font-family:'Montserrat',sans-serif;font-weight:700;color:#00FFFF">${i.name||'—'}</td><td>${i.email}</td><td>${i.service||'—'}</td><td>${i.budget||'—'}</td><td style="max-width:300px;font-size:0.85rem">${i.details||'—'}</td><td><select class="st" onchange="upd(${i.id},this.value)">${['New Brief','Discovery Call','Pitching','In Production','Completed','Passed'].map(s=>`<option ${i.status===s?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="del" onclick="del(${i.id})">Del</button></td></tr>`).join('')}
function upd(id,s){const d=gd();const i=d.find(x=>x.id===id);if(i){i.status=s;sv(d);render()}}
function del(id){if(!confirm('Delete this brief?'))return;sv(gd().filter(x=>x.id!==id));render()}
function exp(){const d=gd();if(!d.length)return alert('No data');const h=['Date','Name','Email','Service','Budget','Details','Status'];const r=d.map(i=>[new Date(i.submittedAt).toLocaleDateString(),i.name,i.email,i.service,i.budget,(i.details||'').replace(/\n/g,' '),i.status]);const c=[h,...r].map(r=>r.map(c=>`"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');const b=new Blob([c],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='studiopxl_briefs.csv';a.click()}
document.getElementById('p').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script></body></html>
